[project]
name = "snaprepo"
version = "0.3.1"
description = "Flatten a codebase into a single AI-ready snapshot."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pathspec>=0.11",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]

[project.scripts]
snaprepo = "snaprepo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["snaprepo.py"]
